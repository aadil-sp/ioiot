name: Sync Backend to HuggingFace

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push backend to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://aadilsp:$HF_TOKEN@huggingface.co/spaces/aadilsp/ioiot-backend hf-space

          cp backend/index.js hf-space/index.js
          cp -r backend/models/. hf-space/models/
          cp -r backend/middleware/. hf-space/middleware/
          cp backend/package.json hf-space/package.json
          cp backend/package-lock.json hf-space/package-lock.json
          cp backend/Dockerfile hf-space/Dockerfile
          cp backend/.dockerignore hf-space/.dockerignore

          cd hf-space
          git config user.email "github-action@github.com"
          git config user.name "GitHub Action"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync — HuggingFace already up to date"
          else
            git commit -m "Sync from GitHub ${{ github.sha }}"
            git push
            echo "Pushed to HuggingFace!"
          fi
